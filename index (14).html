 if(f.min&&+f.min<18)f.min=18;if(f.max&&+f.max<18)f.max=18;var top=bar(sec)+'<div class="filterbox"><b>🔎 Filtrer les profils</b><div class="grid"><div><label>Ville</label><input id="fcity" placeholder="Douala…" value="'+esc(f.city||'')+'"></div><div><label>Genre</label><select id="fg"><option value="">Tous</option><option '+(f.gender==='Femme'?'selected':'')+'>Femme</option><option '+(f.gender==='Homme'?'selected':'')+'>Homme</option></select></div><div><label>Âge minimum</label><input id="fmin" type="number" min="18" max="99" value="'+esc(f.min||'')+'"></div><div><label>Âge maximum</label><input id="fmax" type="number" min="18" max="99" value="'+esc(f.max||'')+'"></div></div><button class="btn" style="margin-top:8px" id="applyf">Appliquer les filtres</button></div><button class="sbtn" data-sim>Profils similaires au mien</button>';
 if(!list.length)return top+note(sec)+'<div class="empty"><h2>Aucun profil trouvé.</h2><p>Modifiez les filtres ou revenez plus tard.</p><button class="btn ghost" id="again">Réinitialiser les profils vus</button></div>';
 var p=list[0];return top+note(sec)+'<div class="card" data-detail="'+p.id+'" style="cursor:pointer"><div class="av" style="--h:'+p.h+'">'+esc(p.n[0])+'</div><div class="body"><div class="tag '+p.i+'">'+SEC[p.i]+'</div> '+cmp(p)+'<h2>'+esc(p.n)+'</h2><p class="meta">'+esc(p.g)+', '+p.a+' ans, '+esc(p.c)+'</p><p class="line">'+esc(p.l)+'</p>'+(p.i==='s'?chips(p.d):chipsX(p.d))+'<p class="small">Toucher pour ouvrir la fiche complète</p><div class="acts"><button class="btn ghost" data-pass="'+p.id+'">Passer</button><button class="btn" data-like="'+p.id+'">J’aime</button></div><button class="btn ghost" style="margin-top:8px" data-request="'+p.id+'">Envoyer une demande de message</button></div></div><button class="small" data-rep="'+p.id+'">Signaler ce profil</button>';
};
var oldBind=bind;bind=function(){oldBind();var ap=document.getElementById('applyf');if(ap)ap.onclick=function(){S.filters={city:document.getElementById('fcity').value.trim(),gender:document.getElementById('fg').value,min:document.getElementById('fmin').value,max:document.getElementById('fmax').value};save();render()};
 app.querySelectorAll('[data-detail]').forEach(function(x){x.onclick=function(e){if(e.target.closest('button'))return;S.detail=+x.dataset.detail;renderDetail()}});
 app.querySelectorAll('[data-request]').forEach(function(x){x.onclick=function(){var id=+x.dataset.request;if(!S.requests.some(function(r){return r.id===id}))S.requests.push({id:id,status:'pending',message:'Bonjour, j’aimerais discuter avec vous.'});save();toast('Demande envoyée (démo).');render()}});
};
function renderDetail(){var p=pf(S.detail);if(!p){render();return}app.innerHTML='<header><div class="logo">direct<i>.com</i></div></header><main><button class="small" id="detailback">← Retour</button><div class="card"><div class="av" style="--h:'+p.h+'">'+esc(p.n[0])+'</div><div class="body"><span class="verified">✓ Profil exemple vérifié*</span><h1>'+esc(p.n)+', '+p.a+' ans</h1><p class="meta">'+esc(p.g)+' · '+esc(p.c)+'</p><p class="line">'+esc(p.l)+'</p>'+chips(p.d)+'<p class="note">*Badge de démonstration, pas une vérification réelle.</p><div class="acts"><button class="btn" id="detailLike">J’aime</button><button class="btn ghost" id="detailReq">Message</button></div><button class="small" id="detailReport">Signaler ce profil</button></div></div></main>';

var oldMatches=matches;matches=function(){var req='<h2 style="margin:12px 0">Demandes de messages</h2>'+((S.requests||[]).length?S.requests.map(function(r){var p=pf(r.id);return '<div class="request">'+av(p)+'<b>'+esc(p.n)+'</b><p>'+esc(r.message)+'</p>'+ (r.status==='pending'?'<div class="acts"><button class="btn" data-accept="'+r.id+'">Accepter</button><button class="btn ghost" data-ignore="'+r.id+'">Ignorer</button><button class="btn ghost" data-block="'+r.id+'">Bloquer</button></div>':'<p class="note">'+(r.status==='accepted'?'Acceptée':'Ignorée / bloquée')+'</p>')+'</div>'}).join(''):'<p class="empty">Aucune demande reçue.</p>');return req+'<h2 style="margin:20px 0 10px">Matchs</h2>'+oldMatches()};

(function(){
  var style=document.createElement('style');
  style.textContent='.demo-banner{margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:12px;color:var(--muted)}.safety-panel{margin:12px 0;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--card)}.safety-panel h3{margin:0 0 8px}.safety-panel button{margin-top:8px}.danger{color:#c62828!important}.toggleline{display:flex;align-items:center;gap:10px;margin:10px 0}.toggleline input{width:auto}';
  document.head.appendChild(style);
  // Avoid implying sample profiles or badges are real
  var _render=render;
  render=function(){
    _render();
    if(app.querySelector('main')&&!app.querySelector('.demo-banner')){
      var b=document.createElement('div');b.className='demo-banner';
      b.textContent='Certains profils affichés sont des exemples fictifs ; les autres sont de vrais membres.';
      app.querySelector('main').prepend(b);
    }
  };
  var _profile=profile;
  profile=function(){
    var html=_profile();
    html+='<section class="safety-panel"><h3>🔐 Confidentialité & sécurité</h3>'+
      '<p class="sub">Votre numéro reste privé. Ne partagez jamais de code de vérification ni d’argent avec un profil.</p>'+
      '<p class="sub">Vos photos sont toujours visibles par tous les membres.</p>'+
      
      '<button class="btn ghost" id="blockedView">Voir les profils bloqués</button>'+
      '<button class="btn ghost danger" id="eraseLocal">Effacer mes données de cet appareil</button></section>';
    return html;
  };
  var _bind=bind;
  bind=function(){
    _bind();
    var ps=document.getElementById('privacySave');
    if(ps)ps.onclick=function(){S.me.photoPublic=!!document.getElementById('photoPrivacy').checked;save();toast('Visibilité mise à jour sur cet appareil.');render()};
    var bv=document.getElementById('blockedView');
    if(bv)bv.onclick=function(){var ids=S.blocked||[];alert(ids.length?'Profils bloqués : '+ids.map(function(id){return (pf(id)||{}).n||id}).join(', '):'Aucun profil bloqué.')};
    var er=document.getElementById('eraseLocal');
    if(er)er.onclick=function(){if(confirm('Effacer le profil, les photos, messages et préférences ? Les jours d’essai et l’historique d’invitations seront conservés.')){var keep=JSON.parse(localStorage.getItem(K)||'{}');localStorage.setItem(K,JSON.stringify({me:null,seen:{},matches:[],chats:{},tab:'d',chat:null,note:'',sec:'',opt:'',trialStart:keep.trialStart||(keep.me&&keep.me.start)||Date.now(),invitedPhones:keep.invitedPhones||[],bonusDays:keep.bonusDays||0,subscriptionUntil:keep.subscriptionUntil||0}));location.reload()}};
  };
  // Report and block actions are recorded locally instead of merely showing a toast
  var _oldBind2=bind;
  bind=function(){
    _oldBind2();
    app.querySelectorAll('[data-rep]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var id=+b.dataset.rep;if(!confirm('Signaler ce profil pour comportement suspect ou abus ?'))return;S.reports=S.reports||[];if(!S.reports.includes(id))S.reports.push(id);save();toast('Signalement enregistré localement (démo).')}})
  };
  // Explicitly mark profiles as fictional in detail page
  var _detail=renderDetail;
  renderDetail=function(){_detail();var v=app.querySelector('.verified');if(v)v.textContent='Profil fictif de démonstration';};
})();

document.getElementById("sw").onclick=function(){keep();mode=up?"in":"up";authView()};
var fg=document.getElementById("fg");if(fg)fg.onclick=function(){keep();mode="forgot";authView()};
document.getElementById("lc").onclick=function(ev){ev.preventDefault();keep();legalView("cgu",authView)};
document.getElementById("lp").onclick=function(ev){ev.preventDefault();keep();legalView("priv",authView)};
document.getElementById("ok").onclick=function(){
var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value,e=document.getElementById("e"),b=this;e.textContent="";draft.em=em;
if(!em||pw.length<6){e.textContent="Entrez un e-mail et un mot de passe de 6 caractères minimum.";return}
if(up&&!document.getElementById("cg").checked){e.textContent="Cochez la case pour confirmer que vous avez 18 ans ou plus et accepter les conditions.";return}
b.disabled=true;
(up?sb.auth.signUp({email:em,password:pw,options:{data:{terms_version:LEGAL.ver,terms_accepted_at:new Date().toISOString()}}}):sb.auth.signInWithPassword({email:em,password:pw})).then(function(r){
b.disabled=false;
if(r.error){e.textContent=frErr(r.error.message);return}
if(!r.data.session){e.textContent="Compte créé. Vérifiez votre e-mail (et vos spams) pour confirmer, puis connectez-vous.";return}
start(r.data.session)})}}
function forgotView(){
app.innerHTML='<header><div class="logo">direct<i>.com</i></div></header><main><h1>Mot de passe oublié</h1><p class="sub">Entrez votre e-mail : nous vous enverrons un lien pour choisir un nouveau mot de passe.</p><label for="em">E-mail</label><input id="em" type="email" autocomplete="email" value="'+esc(draft.em||"")+'"><p class="err" id="e" role="alert"></p><button class="btn" id="ok">Envoyer le lien</button><p style="text-align:center"><button class="small" id="bk">Retour à la connexion</button></p></main>';
document.getElementById("bk").onclick=function(){draft.em=document.getElementById("em").value.trim();mode="in";authView()};
document.getElementById("ok").onclick=function(){
var em=document.getElementById("em").value.trim(),e=document.getElementById("e"),b=this;draft.em=em;e.textContent="";
if(!em||em.indexOf("@")<1){e.textContent="Entrez l’e-mail de votre compte.";return}
b.disabled=true;
sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname}).then(function(r){
b.disabled=false;
if(r.error){e.textContent=frErr(r.error.message);return}
e.className="sub";e.textContent="Si un compte existe avec cet e-mail, un lien vient d’être envoyé. Pensez à vérifier vos spams.";b.style.display="none"})}}
function resetView(){document.documentElement.setAttribute("data-g","");
app.innerHTML='<header><div class="logo">direct<i>.com</i></div></header><main><h1>Nouveau mot de passe</h1><label for="np">Nouveau mot de passe (6 caractères minimum)</label><input id="np" type="password" autocomplete="new-password"><label for="np2">Confirmez le mot de passe</label><input id="np2" type="password" autocomplete="new-password"><p class="err" id="e" role="alert"></p><button class="btn" id="ok">Enregistrer</button></main>';
document.getElementById("ok").onclick=function(){
var a=document.getElementById("np").value,c=document.getElementById("np2").value,e=document.getElementById("e"),b=this;e.textContent="";
if(a.length<6){e.textContent="6 caractères minimum.";return}
if(a!==c){e.textContent="Les deux mots de passe ne sont pas identiques.";return}
b.disabled=true;
sb.auth.updateUser({password:a}).then(function(r){
if(r.error){b.disabled=false;e.textContent=frErr(r.error.message);return}
recov=false;try{history.replaceState(null,"",location.pathname+location.search)}catch(x){}
sb.auth.getSession().then(function(q){if(q.data&&q.data.session){toast("Mot de passe modifié.");start(q.data.session)}else{mode="in";authView()}})})}}
function start(s){sb.from("member_status").select("warnings,banned").eq("id",s.user.id).maybeSingle().then(function(r){var st=r.data;if(st&&st.banned){user=null;sb.auth.signOut();banView();return}warnInfo=st&&st.warnings>0?st:null;loadSub(s.user.id,function(){start2(s)})})}
function start2(s){
user=s.user;var last=localStorage.getItem("direct_uid"),loc=S.me;
if(last&&last!==user.id){S={me:null,seen:{},matches:[],chats:{},tab:"d",chat:null,note:"",sec:"",opt:"",requests:[],filters:{},detail:null};loc=null}
localStorage.setItem("direct_uid",user.id);
sb.from("user_state").select("data").eq("id",user.id).maybeSingle().then(function(r){
var c=r.data&&r.data.data;
if(c){S=Object.assign(S,c,{tab:"d",chat:null,detail:null});if(S.me){S.me.ph=loc&&loc.ph||"";S.me.photos=loc&&loc.photos&&loc.photos.length?loc.photos:(S.me.photoUrls||[])}}
applySub();loaded=true;baseSave();if(!c){save()}pub();loadMembers(function(){loadConv(function(){render();listen()})});if(warnInfo)setTimeout(function(){toast("Avertissement "+warnInfo.warnings+" sur 2 : les photos ne doivent contenir aucun caractère sexuel. Au deuxième avertissement, votre compte sera bloqué.")},800);setInterval(function(){loadNotifs();loadSub(user.id,function(){var was=daysLeft()<=0&&!subscriptionActive();applySub();if(was&&(daysLeft()>0||subscriptionActive()))render();loadMembers(function(){loadConv()})})},60000)})}
sb.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){recov=true;resetView()}});
sb.auth.getSession().then(function(r){if(recov&&r.data&&r.data.session){resetView();return}if(r.data&&r.data.session){start(r.data.session)}else{render()}});
})();
</script>
